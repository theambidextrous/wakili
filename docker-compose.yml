version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wakili-mailhog
    ports:
      - "1025:1025"    # SMTP port
      - "8025:8025"    # Web UI port
    environment:
      MH_STORAGE: memory
      MH_MAILDIR_PATH: /maildir
    volumes:
      - mailhog_data:/maildir
    networks:
      - wakili-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: mailhog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mailhog_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wakili-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mailhog_data:
  postgres_data:

networks:
  wakili-network:
    driver: bridge
